<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Brewhaus</title>

	<!-- Google Fonts  -->
	 <link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">

	<link rel="stylesheet" href="style.css">
</head>
<body>
	<div class="main-container">
		
		<div class="navbar-hero-section">
			<div class="navbar-container">
				<div class="nav-bar">
					<div class="navbar-left">
						<img src="./images/brewhaus-logo.svg" alt="brewhaus logo">
						<h1>Brewhaus</h1>
					</div>

					<div class="navbar-middle">
						<span>Home</span>
						<span>About</span>
						<span>Menu</span>
						<span>Pricing</span>
						<span>Contact</span>
					</div>

					<div class="navbar-right">
						<img src="./images/cart.svg" alt="cart image">
						<div class="subscribe-btn">
							<a href=".blank">Subscribe</a>
						</div>
					</div>
				</div>
			</div>

			<div class="hero-container">
				<div id="special-coffee">SPECIALTY COFFEE SUBSCRIPTION</div>
				<div class="hero-heading">Fresh-roasted coffee for your slow Sundays</div>
				<div class="hero-para">Single-origin beans from 18 partner farms, roasted to order and at your door within 72 hours of roasting.</div>
				<div class="hero-buttons">
					<div class="start-btn">
						<a href=".blank">Start your subscription &rarr; </a> 
						<!-- &rarr; Right arrow -->
					</div>

					<div class="explore-btn">
						<a href=".blank">Explore the menu</a>
					</div>
				</div>

				<div class="scroll-btn">SCROLL &#8964;</div>
				<!-- &#8964; down arrowhead -->
			</div>


		</div>
	
	
	</div>

</html>
