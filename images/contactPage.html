<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>new page</title>
	<link rel="stylesheet" href="../style.css">
</head>
<body>
	<div class="contact-section" id="contact-us-id">
			<div class="contact-container">
				
				<div class="contact-left">
					<span>CONTACT</span>
					<h2>Let's talk coffee</h2>
					<p>Questions about your subscription, wholesale for your café, or feedback on this month's roast. We read every message.</p>
					<div class="email-contact"><img src="email-logo.svg" alt="email-logo">hello@brewhaus.coffee</div>
					<div class="call-contact"><img src="call-logo.svg" alt="call-logo">+91 98765 43210</div>
				</div>

				<div class="contact-right">
					<form action="">

						<div class="fullname">
							<label for="name">Full name</label>
							<input type="text" placeholder="Aarav Sharma" name="name" id="name" required>
						</div>

						<div class="email">
							<label for="email">Email</label>
							<input type="email" placeholder="you@example.com" name="email" id="email" required>
						</div>
						
						<div class="phone">
							<label for="phone-no">Phone</label>
							<input type="text" placeholder="10-digit mobile number" name="phone-no" id="phone-no">
						</div>

						<div class="subject">
							<label for="subject-select">Subject</label>
							<select name="slect-subject" id="subject-select">
								<!-- <option value="" disabled selected hidden>Select a subject</option> -->
								<option value="" selected>Select a subject</option>
								<option value="Subscription help">Subscription help</option>
								<option value="Wholesale enquiry">Wholesale enquiry</option>
								<option value="Feedback">Feedback</option>
								<option value="Something else">Something else</option>
							</select>
						</div>

						<div class="message">
							<label for="write-message">message</label>
							<input type="text" placeholder="How can I help?" name="message" id="write-message">
						</div>

						<div class="submit-field">
							<p>All fields are required.</p>
							<div class="read-story-btn">
								<a href="#">Send message</a>
							</div>
						</div>

					</form>

				</div>
			</div>
		</div>
</body>
</html>
